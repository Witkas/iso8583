# iso8583lens default packager
#
# Dialect: ISO 8583:1987, "ASCII" flavour.
#   - MTI:     4 ASCII digits.
#   - Bitmap:  raw binary, 8 bytes (64 bits) per block. Bit 1 (the most
#              significant bit of the first byte) set means a secondary
#              bitmap block follows, extending coverage to fields 65-128.
#   - Fields:  ASCII. FIXED fields are a known number of characters.
#              LLVAR fields carry a 2-digit ASCII length prefix, LLLVAR a
#              3-digit ASCII length prefix; the prefix counts data characters.
#
# The `length` for FIXED fields and `maxLength` for LLVAR/LLLVAR are in
# characters (which, for ASCII, equals bytes). A handful of fields are
# binary in the standard (PIN block, MACs); in this ASCII dialect they are
# carried as hex text, so their length is given in hex characters and noted.
#
# This layout follows the classic 128-element ISO 8583:1987 definition also
# used as jPOS's generic packager reference. Encoding is declared per part so
# a future binary/BCD dialect can reuse the same schema. Field names are
# quoted because many contain commas.

name: iso8583-1987-ascii
description: ISO 8583:1987 generic layout, ASCII fields with a binary bitmap

mti:
  length: 4
  encoding: ascii

bitmap:
  encoding: binary

fields:
  2:   { name: "Primary Account Number (PAN)",          type: LLVAR,  maxLength: 19,  encoding: ascii }
