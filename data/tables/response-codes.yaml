# ISO 8583 field 39 response codes (1987 numeric-code set).
# code -> meaning. Not exhaustive; covers the common values.
codes:
  "00": Approved
  "01": Refer to card issuer
  "02": Refer to card issuer, special condition
  "03": Invalid merchant
  "04": Pick up card
  "05": Do not honor
  "06": Error
  "07": Pick up card, special condition
  "08": Honor with identification
  "09": Request in progress
  "10": Approved, partial
  "11": Approved, VIP
  "12": Invalid transaction
  "13": Invalid amount
  "14": Invalid card number (no such number)
  "15": No such issuer
  "19": Re-enter transaction
  "21": No action taken
  "25": Unable to locate record on file
  "28": File update file locked out
  "30": Format error
  "41": Lost card, pick up
  "43": Stolen card, pick up
  "51": Insufficient funds
  "52": No checking account
  "53": No savings account
  "54": Expired card
  "55": Incorrect PIN
  "57": Transaction not permitted to cardholder
  "58": Transaction not permitted to terminal
  "59": Suspected fraud
  "61": Exceeds withdrawal amount limit
  "62": Restricted card
  "63": Security violation
  "65": Exceeds withdrawal frequency limit
  "75": Allowable number of PIN tries exceeded
  "76": Invalid/nonexistent "to" account
  "77": Invalid/nonexistent "from" account
  "78": Invalid/nonexistent account specified (general)
  "84": Invalid authorization life cycle
  "85": No reason to decline (account verification / address verification)
  "91": Issuer or switch is inoperative
  "92": Financial institution unknown / cannot route
  "94": Duplicate transmission
  "96": System malfunction
